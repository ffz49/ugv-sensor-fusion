# config/twist_mux.yaml
twist_mux:
  ros__parameters:
    topics:
      navigation:
        topic: /cmd_vel_auto     # From your experiment_control_node
        timeout: 0.5
        priority: 10
      joystick:
        topic: /cmd_vel_teleop   # From your manual joystick/keyboard
        timeout: 0.5
        priority: 100            # Joystick overrides autonomy

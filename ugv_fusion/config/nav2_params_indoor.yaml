global_costmap:
  global_costmap:
    ros__parameters:
      transform_tolerance: 1.0
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false

      # --- GLOBAL CANVAS: 100 m patrol length x 40 m lateral ---
      # 100x40 @ 0.10 m = 400k cells. At 0.05 m this would be 1.6M and the
      # NavFn planner drops below 1 Hz (measured), so resolution stays at 0.10.
      rolling_window: false
      always_send_full_costmap: True
      width: 40
      height: 16
      origin_x: -5.0
      origin_y: -8.0
      resolution: 0.10
      robot_radius: 0.50

      plugins: ["memory_layer", "inflation_layer"]

      memory_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: fused_memory_cloud
        fused_memory_cloud:
          topic: /planning/fused_memory_cloud
          data_type: PointCloud2
          marking: True
          # clearing MUST stay True: with clearing False the map seals shut
          # and the planner fails to find any route.
          clearing: True
          max_obstacle_height: 2.0
          obstacle_max_range: 10.0
          raytrace_max_range: 20.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 0.85 > circumscribed radius 0.648 m (sqrt(0.525^2 + 0.38^2)).
        # Smaller values trigger "Inconsistent configuration in collision checking".
        inflation_radius: 0.70
        cost_scaling_factor: 1.8

local_costmap:
  local_costmap:
    ros__parameters:
      transform_tolerance: 1.0
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false

      # --- LOCAL REACTIVE WINDOW: 20 m so MPPI can act on early detections ---
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.10
      robot_radius: 0.50

      plugins: ["fused_layer", "dynamic_layer", "inflation_layer"]

      # Fused BEV obstacles arrive as a PointCloud2 in base_link and are
      # transformed into odom by the ObstacleLayer. (A StaticLayer on a
      # base_link grid was the original cause of the FollowPath aborts.)
      fused_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: fused_cloud
        fused_cloud:
          topic: /planning/fused_memory_cloud
          data_type: PointCloud2
          marking: True
          clearing: True
          max_obstacle_height: 2.0
          obstacle_max_range: 15.0
          raytrace_max_range: 20.0

      dynamic_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: dynamic_cloud
        dynamic_cloud:
          topic: /planning/dynamic_obstacles
          data_type: PointCloud2
          clearing: True
          marking: True
          max_obstacle_height: 2.0
          obstacle_max_range: 15.0
          raytrace_max_range: 20.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.70
        cost_scaling_factor: 1.8

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    robot_radius: 0.50
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 20.0

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 70
      model_dt: 0.1
      batch_size: 800

      motion_model: "DiffDrive"
      vx_max: 1.0
      vx_min: 0.0          # forward only: no rear sensing, so never reverse
      vy_max: 0.0
      wz_max: 1.0

      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4

      critics: ["ConstraintCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic", "ObstaclesCritic"]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0
        threshold_to_consider: 0.5
        # Still allows leaving the path when it runs through occupied cells
        max_path_occupancy_ratio: 0.05

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        threshold_to_consider: 0.5

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

      # ObstaclesCritic has NO 'cost_weight' parameter. It reads
      # repulsion_weight and critical_weight; anything else is silently ignored.
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.8
        critical_weight: 20.0
        inflation_radius: 0.70
        cost_scaling_factor: 1.8
        consider_footprint: false
        collision_cost: 100000.0
        collision_margin_distance: 0.30
        near_goal_distance: 0.5

bt_navigator:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link
    enable_recovery: true
    bt_loop_duration: 50

planner_server:
  ros__parameters:
    transform_tolerance: 1.0
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      use_astar: true
      allow_unknown: true         # required: 3-state grids report UNKNOWN beyond sensor range
      tolerance: 2.0

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]

    spin:
      plugin: "nav2_behaviors/Spin"
      simulate_ahead_time: 2.0
      max_rotational_vel: 0.5
      min_rotational_vel: 0.1
      rotational_acc_lim: 0.8

    backup:
      plugin: "nav2_behaviors/BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"

    wait:
      plugin: "nav2_behaviors/Wait"
